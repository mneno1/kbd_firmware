name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK CLI
        run: |
          python3 -m pip install --upgrade qmk

      - name: Setup QMK Workspace
        run: |
          # 実際のQMKファームウェア（vial-qmk）があるディレクトリに移動
          cd keyboards/cornelius/vial-kb/vial-qmk
          
          # QMK CLIに対して、このフォルダをルートとして設定＆必要なサブモジュールを自動取得
          qmk setup -y -H .

      - name: Build Cornelius Firmware
        run: |
          cd keyboards/cornelius/vial-kb/vial-qmk
          
          # コンパイルを実行
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # 生成されたファームウェアファイルを回収
          path: |
            keyboards/cornelius/vial-kb/vial-qmk/*.hex
            keyboards/cornelius/vial-kb/vial-qmk/*.bin
            keyboards/cornelius/vial-kb/vial-qmk/*.uf2
