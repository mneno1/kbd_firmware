name: Build Cornelius Vial Firmware (Perfect Match)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 古い安定したGCCを動かすため、OSのバージョンを明示的に固定します

    steps:
      # 1. あなたのリポジトリを取得（古い壊れたサブモジュールは無視）
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      # 2. 変数を使用してURLを安全に組み立ててクローン
      - name: Clone Base QMK Source
        run: |
          PROTOCOL="https://"
          DOMAIN="github.com"
          PATH_NAME="/vial-kb/vial-qmk.git"
          FULL_URL="${PROTOCOL}${DOMAIN}${PATH_NAME}"
          git clone --depth=1 "${FULL_URL}" /home/runner/vial-qmk

      # 3. あなたのリポジトリ内の「cornelius」の定義ファイルを一括移植
      - name: Inject Cornelius Original Files
        run: |
          rm -rf /home/runner/vial-qmk/keyboards/foostan/cornelius
          mkdir -p /home/runner/vial-qmk/keyboards/foostan/cornelius
          cp -r keyboards/cornelius/qmk/qmk_firmware/* /home/runner/vial-qmk/keyboards/foostan/cornelius/
          
          # あなたが用意した「cornelius_vial」フォルダ内の最新キーマップを流し込む
          mkdir -p /home/runner/vial-qmk/keyboards/foostan/cornelius/keymaps/vial
          cp -r cornelius_vial/* /home/runner/vial-qmk/keyboards/foostan/cornelius/keymaps/vial/

      # 4. 依存ライブラリの同期
      - name: Fetch Official Submodules
        run: |
          cd /home/runner/vial-qmk
          git submodule update --init --recursive

      # 5. 【重要】容量が溢れない、当時と同じ古いGCC 8コンパイラを正しくインストール
      - name: Install Correct Compiler Toolchain (GCC 8)
        run: |
          sudo apt-get update
          # 古いOSのリポジトリから、容量が最も小さくなるgcc-avr (バージョン8) を指定して入れます
          sudo apt-get install -y gcc-avr=1:8.3.0+Atmel3.6.2-11 binutils-avr avr-libc git python3-pip
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          python3 -m pip install --upgrade qmk

      # 6. コンパイルを実行
      - name: Build Custom Firmware
        run: |
          cd /home/runner/vial-qmk
          qmk config user.qmk_home=$(pwd)
          qmk compile -kb foostan/cornelius -km vial -e ALLOW_WARNINGS=yes

      # 7. 生成されたファームウェアファイルを回収
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /home/runner/vial-qmk/*.hex
            /home/runner/vial-qmk/*.bin
            /home/runner/vial-qmk/*.uf2
