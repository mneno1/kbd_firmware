name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK
        run: |
          python3 -m pip install --upgrade qmk
          qmk setup -y

      - name: Build Cornelius Firmware
        run: |
          # 実際のQMKファームウェア本体が格納されているディレクトリに移動
          cd keyboards/cornelius/vial-kb/vial-qmk
          
          # サブモジュールの同期（コンパイルに必要なchibiosやlufa等を取得）
          make git-submodule
          
          # カレントディレクトリ（vial-qmk）をQMKのホーム（作業場所）に設定
          qmk config user.qmk_home=$(pwd)
          
          # コンパイルを実行
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # vial-qmk ディレクトリ内に生成された各種ファームウェアを回収
          path: |
            keyboards/cornelius/vial-kb/vial-qmk/*.hex
            keyboards/cornelius/vial-kb/vial-qmk/*.bin
            keyboards/cornelius/vial-kb/vial-qmk/*.uf2
