name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QMK CLI & Set up Official QMK
        run: |
          python3 -m pip install --upgrade qmk
          # 公式の正しいQMK環境をデフォルトの位置 (~/qmk_firmware) にクローンしてセットアップ
          qmk setup -y

      - name: Copy Cornelius Files to QMK Workspace
        run: |
          # リポジトリ内にある cornelius のキーボード定義一式を、公式QMKの該当フォルダへ丸ごとコピー
          cp -r keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius ~/qmk_firmware/keyboards/

      - name: Build Firmware
        run: |
          cd ~/qmk_firmware
          # コピーしたキーボード名とキーマップを指定してコンパイル
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # 生成されたファームウェアファイルを回収
          path: |
            /home/runner/qmk_firmware/*.hex
            /home/runner/qmk_firmware/*.bin
            /home/runner/qmk_firmware/*.uf2
