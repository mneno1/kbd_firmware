name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Docker Hubではなく、GitHub公式レジストリのQMKコンテナを使用（認証不要・最速）
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          # 1. コンテナ内のQMK環境のキーボードフォルダに、今回のリポジトリ内の cornelius をコピー
          cp -r keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius /qmk_firmware/keyboards/
          
          # 2. QMKのルートディレクトリに移動
          cd /qmk_firmware
          
          # 3. ビルドを実行（コンパイラは最初からコンテナに入っているので即開始されます）
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /qmk_firmware/*.hex
            /qmk_firmware/*.bin
            /qmk_firmware/*.uf2
