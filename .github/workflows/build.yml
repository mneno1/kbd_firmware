name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK
        run: |
          python3 -m pip install --upgrade qmk
          qmk setup -y

      - name: Build
        run: |
          qmk compile -kb cornelius -km vial

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            *.hex
            *.bin
            *.uf2
