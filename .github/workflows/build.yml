name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # サブモジュールも確実に取得

      - name: Run QMK Compilation Action
        uses: qmk/qmk-firmware-buildaction@v4
        with:
          # あなたのリポジトリ内にある「vial-qmk」のフォルダパスを直接指定
          qmk_home: keyboards/cornelius/vial-kb/vial-qmk
          keyboard: cornelius
          keymap: vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # アクションによってビルドされたファームウェアファイルを自動回収
          path: |
            keyboards/cornelius/vial-kb/vial-qmk/*.hex
            keyboards/cornelius/vial-kb/vial-qmk/*.bin
            keyboards/cornelius/vial-kb/vial-qmk/*.uf2
