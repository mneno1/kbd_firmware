name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          # $GITHUB_WORKSPACE を明示することで、チェックアウトされたフォルダから確実にコピーします
          cp -r $GITHUB_WORKSPACE/keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius /qmk_firmware/keyboards/
          
          # QMKの作業ルートに移動
          cd /qmk_firmware
          
          # コンパイルを実行
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /qmk_firmware/*.hex
            /qmk_firmware/*.bin
            /qmk_firmware/*.uf2
