name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK CLI
        run: |
          python3 -m pip install --upgrade qmk

      - name: Setup QMK Workspace
        run: |
          # QMKツールのルールを回避するため、リポジトリ内のファームウェアを
          # 「qmk_firmware」という名前の別ディレクトリとして配置・命名する
          mv keyboards/cornelius/vial-kb/vial-qmk /home/runner/qmk_firmware
          
          # 正しいフォルダ名になった状態で、QMKのホームディレクトリとして設定
          qmk setup -y --home /home/runner/qmk_firmware

      - name: Build Cornelius Firmware
        run: |
          cd /home/runner/qmk_firmware
          
          # コンパイルを実行
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # ビルドされ出力された成果物を回収
          path: |
            /home/runner/qmk_firmware/*.hex
            /home/runner/qmk_firmware/*.bin
            /home/runner/qmk_firmware/*.uf2
