name: Build Cornelius Vial Firmware (Safe Plan)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. あなたのリポジトリを取得（古い壊れたサブモジュールは無視）
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      # 2. 変数を使用してURLを安全に組み立ててクローン（引数の位置を完全に修正）
      - name: Clone Clean Official Vial-QMK
        run: |
          PROTOCOL="https://"
          DOMAIN="github.com"
          PATH_NAME="/vial-kb/vial-qmk.git"
          FULL_URL="${PROTOCOL}${DOMAIN}${PATH_NAME}"
          git clone --depth=1 "${FULL_URL}" /home/runner/vial-qmk

      # 3. 公式システムに必要な共通ライブラリをすべて同期
      - name: Fetch Official Submodules
        run: |
          cd /home/runner/vial-qmk
          git submodule update --init --recursive

      # 4. あなたが作った cornelius_vial フォルダのファイルだけを公式システムへ移植
      - name: Inject Custom Keymap Files
        run: |
          mkdir -p /home/runner/vial-qmk/keyboards/foostan/cornelius/keymaps/vial
          cp -r cornelius_vial/* /home/runner/vial-qmk/keyboards/foostan/cornelius/keymaps/vial/

      # 5. コンパイラ群を一括インストール
      - name: Install Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi gcc-avr avr-libc git python3-pip
          python3 -m pip install --upgrade qmk

      # 6. コンパイルを実行
      - name: Build Custom Firmware
        run: |
          cd /home/runner/vial-qmk
          qmk config user.qmk_home=$(pwd)
          qmk compile -kb foostan/cornelius -km vial -e ALLOW_WARNINGS=yes

      # 7. 生成されたファームウェアファイルを回収
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /home/runner/vial-qmk/*.hex
            /home/runner/vial-qmk/*.bin
            /home/runner/vial-qmk/*.uf2
