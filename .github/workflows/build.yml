name: Build Cornelius Vial Firmware

on:
  push:
    branches:
      - main
    paths:
      - "keyboards/cornelius/**"
      - ".github/workflows/build.yml"
      - "Makefile"
      - ".gitmodules"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK dependencies
        working-directory: src/vial-kb/vial-qmk
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3-pip \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

          python3 -m pip install --user qmk

      - name: Setup QMK
        working-directory: src/vial-kb/vial-qmk
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          qmk setup -H "$(pwd)" -y

      - name: Initialize Cornelius Vial build
        run: |
          kb=cornelius make vial-qmk-init

      - name: Build Cornelius Vial firmware
        run: |
          kb=cornelius kr=rev2 km=vial make vial-qmk-compile

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius-rev2-vial-firmware
          path: keyboards/cornelius/vial-kb/vial-qmk/.build/cornelius_rev2_vial.uf2
          if-no-files-found: error
