name: Build Cornelius Vial Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 全コンパイラとcompileコマンドが最初から入っている完全版コンテナを使用
    container: ghcr.io/qmk/qmk_firmware:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # vial-qmkのリポジトリを丸ごとロードするために必須
          submodules: recursive

      - name: Build Firmware
        run: |
          # 1. あなたのリポジトリにある、vial-qmk のフォルダに移動
          cd keyboards/cornelius/vial-kb/vial-qmk
          
          # 2. 移動したこのフォルダを、QMKの作業ホームとして強制的に設定
          qmk config user.qmk_home=$(pwd)
          
          # 3. コンパイルを実行（完全版コンテナなので即ビルドが走ります）
          qmk compile -kb cornelius -km vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          # 生成されたファームウェアファイルを回収
          path: |
            keyboards/cornelius/vial-kb/vial-qmk/*.hex
            keyboards/cornelius/vial-kb/vial-qmk/*.bin
            keyboards/cornelius/vial-kb/vial-qmk/*.uf2
