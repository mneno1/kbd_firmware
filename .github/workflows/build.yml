name: Build Cornelius Vial Firmware (Plan B - Final)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. あなたのリポジトリにあるキーマップファイルをチェックアウト
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      # 2. 本家Vial公式の最新システムを1行で確実にクローン（URLのちぎれを修正）
      - name: Clone Official Vial-QMK Source
        run: git clone --depth=1 https://github.com /home/runner/vial-qmk

      # 3. あなたのリポジトリにあるCorneliusのファイルを移植
      - name: Inject Cornelius Files
        run: |
          mkdir -p /home/runner/vial-qmk/keyboards/cornelius/keymaps/vial
          cp -r keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/keymaps/vial/* /home/runner/vial-qmk/keyboards/cornelius/keymaps/vial/
          
          if [ -f keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/rules.mk ]; then
            cp keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/rules.mk /home/runner/vial-qmk/keyboards/cornelius/
          fi
          if [ -f keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/config.h ]; then
            cp keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/config.h /home/runner/vial-qmk/keyboards/cornelius/
          fi

      # 4. ビルドに必要な最小限のコンパイラをUbuntuに直接インストール
      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi git python3-pip
          python3 -m pip install --upgrade qmk

      # 5. ビルドを実行（古いコードの警告で止まらないように対策を追加）
      - name: Build Firmware
        run: |
          cd /home/runner/vial-qmk
          qmk config user.qmk_home=$(pwd)
          # ALLOW_WARNINGS=yes を付与して、多少の古い記述があっても強制的にバイナリを出力させます
          qmk compile -kb cornelius -km vial -e ALLOW_WARNINGS=yes

      # 6. ファームウェアの回収
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /home/runner/vial-qmk/*.hex
            /home/runner/vial-qmk/*.bin
            /home/runner/vial-qmk/*.uf2
