name: Build Cornelius Vial Firmware (Plan B - Fast)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. あなたのリポジトリにあるキーマップファイルをチェックアウト
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      # 2. 本家Vial公式の「動く最新システム」をダウンロード
      - name: Clone Official Vial-QMK Source
        run: |
          git clone --depth=1 https://github.com ~/vial-qmk

      # 3. あなたのリポジトリにあるCorneliusのファイルを公式システムへ移植
      - name: Inject Cornelius Files
        run: |
          mkdir -p ~/vial-qmk/keyboards/cornelius/keymaps/vial
          cp -r keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/keymaps/vial/* ~/vial-qmk/keyboards/cornelius/keymaps/vial/
          
          if [ -f keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/rules.mk ]; then
            cp keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/rules.mk ~/vial-qmk/keyboards/cornelius/
          fi
          if [ -f keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/config.h ]; then
            cp keyboards/cornelius/vial-kb/vial-qmk/keyboards/cornelius/config.h ~/vial-qmk/keyboards/cornelius/
          fi

      # 4. Cornelius（RP2040/ARMマイコン）のビルドに必要な最小限のコンパイラだけを入れる
      # ※全体のダウンロードを行わないため、ここが劇的に早くなります
      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi git python3-pip
          python3 -m pip install --upgrade qmk

      # 5. ビルドを実行
      - name: Build Firmware
        run: |
          cd ~/vial-qmk
          # 不要な全体のセットアップをスキップし、このフォルダ単体でビルド
          qmk config user.qmk_home=$(pwd)
          qmk compile -kb cornelius -km vial

      # 6. ファームウェアの回収
      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cornelius_vial_firmware
          path: |
            /home/runner/vial-qmk/*.hex
            /home/runner/vial-qmk/*.bin
            /home/runner/vial-qmk/*.uf2
